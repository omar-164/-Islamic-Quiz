<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار فقه المعاملات - باب البيع</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    color: #333;
  }
  .container {
    background: #fff;
    max-width: 800px;
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #1a2a6c, #2a5298);
    color: #fff;
    padding: 25px 20px;
    text-align: center;
  }
  header h1 { font-size: 1.5em; margin-bottom: 8px; }
  header p { font-size: 0.9em; opacity: 0.85; }
  .progress-bar { height: 8px; background: #e0e0e0; width: 100%; }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    width: 0%;
    transition: width 0.4s ease;
  }
  .stats {
    display: flex;
    justify-content: space-around;
    padding: 12px;
    background: #f5f7fa;
    font-size: 0.9em;
    font-weight: bold;
    border-bottom: 1px solid #e0e0e0;
  }
  .stats span { color: #1a2a6c; }
  .quiz-body { padding: 25px; min-height: 320px; }
  .category-badge {
    display: inline-block;
    background: #e8f0fe;
    color: #1a2a6c;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.15em;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 20px;
    color: #1a1a1a;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    padding: 14px 18px;
    border: 2px solid #d0d7de;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1em;
    background: #fff;
    text-align: right;
    font-family: inherit;
  }
  .option:hover:not(.disabled) {
    border-color: #1a2a6c;
    background: #f0f6ff;
    transform: translateX(-4px);
  }
  .option.correct {
    border-color: #11998e;
    background: #d4f5e9;
    font-weight: bold;
  }
  .option.wrong {
    border-color: #e74c3c;
    background: #fde8e6;
    font-weight: bold;
  }
  .option.disabled { cursor: not-allowed; }
  .tf-buttons { display: flex; gap: 15px; }
  .tf-buttons .option { flex: 1; text-align: center; font-weight: bold; }
  .fill-input {
    width: 100%;
    padding: 14px;
    border: 2px solid #d0d7de;
    border-radius: 10px;
    font-size: 1em;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .fill-input:focus { outline: none; border-color: #1a2a6c; }
  .btn {
    background: linear-gradient(135deg, #1a2a6c, #2a5298);
    color: #fff;
    border: none;
    padding: 12px 30px;
    border-radius: 10px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-next {
    display: block;
    margin: 20px auto 0;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #003;
  }
  .feedback {
    margin-top: 18px;
    padding: 15px;
    border-radius: 10px;
    font-size: 0.95em;
    line-height: 1.7;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #d4f5e9; border-right: 5px solid #11998e; }
  .feedback.wrong { background: #fde8e6; border-right: 5px solid #e74c3c; }
  .feedback strong { display: block; margin-bottom: 6px; }
  .result-screen { text-align: center; padding: 40px 25px; display: none; }
  .result-screen.show { display: block; }
  .score-circle {
    width: 150px; height: 150px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #1a2a6c, #2a5298);
  }
  .score-circle .num { font-size: 2.5em; }
  .score-circle .lbl { font-size: 0.9em; opacity: 0.9; }
  .result-screen h2 { color: #1a2a6c; margin-bottom: 15px; }
  .result-screen p { margin-bottom: 20px; line-height: 1.7; }
  .review-list {
    text-align: right;
    max-height: 300px;
    overflow-y: auto;
    margin: 20px 0;
    padding: 15px;
    background: #f9fafb;
    border-radius: 10px;
    border: 1px solid #e0e0e0;
  }
  .review-item {
    padding: 10px;
    border-bottom: 1px solid #e8e8e8;
    font-size: 0.9em;
    line-height: 1.6;
  }
  .review-item:last-child { border-bottom: none; }
  .review-item .q { font-weight: bold; color: #1a2a6c; }
  .review-item .a { color: #11998e; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>💼 اختبار فقه المعاملات - باب البيع</h1>
    <p>مقرر اختبار السعي — فقه المعاملات</p>
  </header>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="stats">
    <span>السؤال: <span id="qNum">1</span> / <span id="qTotal">85</span></span>
    <span>الصحيح: <span id="score">0</span></span>
    <span>الخطأ: <span id="wrong">0</span></span>
  </div>
  <div class="quiz-body" id="quizBody">
    <div class="category-badge" id="categoryBadge"></div>
    <div class="question-text" id="questionText"></div>
    <div id="answerArea"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-next hidden" id="nextBtn" onclick="nextQuestion()">السؤال التالي ←</button>
  </div>
  <div class="result-screen" id="resultScreen">
    <div class="score-circle">
      <span class="num" id="finalScore">0</span>
      <span class="lbl">من <span id="finalTotal">85</span></span>
    </div>
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <div class="review-list" id="reviewList"></div>
    <button class="btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
  </div>
</div>

<script>
const questions = [
  // ===== المفهوم والمشروعية (1-10) =====
  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"ما معنى البيع في اللغة؟",
   opts:["أخذ شيء وإعطاء شيء، مأخوذ من الباع","الإمساك والركود","السفر والتنقل","الكلام والصمت"],
   correct:0,
   exp:"البيع لغةً: أخذ شيء وإعطاء شيء، مأخوذ من الباع؛ لأن كل واحد من المتبايعين يمد باعه للأخذ والإعطاء."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"البيع شرعاً هو:",
   opts:["مبادلة مال ولو في الذمة أو منفعة مباحة مطلقاً بمثل أحدهما على التأبيد غير ربا وقرض","الإمساك عن المفطرات","تبادل المنافع فقط","نقل الملك بغير عوض"],
   correct:0,
   exp:"البيع شرعاً: مبادلة مال ولو في الذمة أو منفعة مباحة مطلقاً بمثل أحدهما على التأبيد غير ربا وقرض."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"ما حكم البيع في الأصل؟",
   opts:["الحل والجواز حتى يدل الدليل على الحرمة","الكراهة","الوجوب","التحريم"],

   exp:"قال تعالى: ﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾ — والأصل في البيع الحل والجواز حتى يدل الدليل على الحرمة."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"ما الدليل من القرآن على مشروعية البيع؟",
   opts:["قوله تعالى: ﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾","قوله تعالى: ﴿وَكُلُوا وَاشْرَبُوا﴾","قوله تعالى: ﴿إِنِّي نَذَرْتُ لِلرَّحْمَنِ صَوْمًا﴾","قوله تعالى: ﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الصِّيَامُ﴾"],
   correct:0,
   exp:"قوله تعالى: ﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾ [البقرة: 275]."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"قال النبي ﷺ: «رحم الله رجلاً سمحاً إذا باع، وإذا اشترى، وإذا اقتضى» — هذا من:",
   opts:["السنة القولية","السنة الفعلية","السنة التقريرية","الإجماع"],
   correct:0,
   exp:"هذا حديث قولي رواه البخاري عن جابر بن عبد الله رضي الله عنه."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"شراء النبي ﷺ من جابر بن عبد الله بعيره، دليل من:",
   opts:["السنة الفعلية","السنة القولية","السنة التقريرية","الإجماع"],
   correct:0,
   exp:"السنة الفعلية: فعله ﷺ في تعامله بالبيع والشراء."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"إقرار النبي ﷺ لأهل المدينة على البيع والشراء في سوقهم دليل من:",
   opts:["السنة التقريرية","السنة القولية","السنة الفعلية","الإجماع"],

   exp:"السنة التقريرية: أنه ﷺ قدم المدينة والسوق قائم، فأقر الناس على البيع."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"من نقل الإجماع على جواز البيع؟",

   exp:"قال ابن قدامة: «وأجمع المسلمون على جواز البيع في الجملة»."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"ما الحكمة من مشروعية البيع؟",
   opts:["حاجة الإنسان تتعلق بما في يد صاحبه، وفي تجويز البيع وصول كل واحد إلى غرضه","الترفيه","إشغال الناس","جمع المال"],
   correct:0,
   exp:"الحكمة: حاجة الإنسان تتعلق بما في يد صاحبه، وفي تجويز البيع وصول كل منهما إلى غرضه ودفع حاجته."},

  {cat:"المفهوم والمشروعية", type:"mcq",
   q:"قال عمر بن الخطاب رضي الله عنه: «لا يَبيع في سوقنا إلا من قد...»:",
   opts:["تفقه في الدين","حفظ القرآن","قرأ الحديث","عرف الحساب"],
   correct:0,
   exp:"روى الترمذي وحسنه الألباني: أن عمر بن الخطاب قال: «لا يَبيع في سوقنا إلا من قد تفقه في الدين»."},

  // ===== الأركان والصيغة (11-25) =====
  {cat:"الأركان والصيغة", type:"mcq",
   q:"ما أركان البيع؟",
   opts:["العاقدان، والمعقود عليه، والصيغة","النية، والقول، والفعل","البائع، والمشتري فقط","المبيع، والثمن فقط"],

   exp:"أركان البيع ثلاثة: العاقدان، والمعقود عليه (المبيع والثمن)، والصيغة."},

  {cat:"الأركان والصيغة", type:"mcq",
   q:"من العاقدان في عقد البيع؟",
   opts:["البائع والمشتري اللذان يقوم العقد بتوافق إرادتيهما","الشاهدان","الوكيل والولي","الناظر والوصي"],
   correct:0,
   exp:"العاقدان: البائع والمشتري اللذان يقوم العقد بتوافق إرادتيهما."},

  {cat:"الأركان والصيغة", type:"mcq",
   q:"ما المقصود بالمعقود عليه في البيع؟",
   opts:["المبيع والثمن","الشهود","المجلس","الزمن"],
   correct:0,
   exp:"المعقود عليه في عقد البيع: المبيع والثمن."},

  {cat:"الأركان والصيغة", type:"mcq",
   q:"ما الصيغة في البيع؟",
   opts:["اللفظ الذي يصدر من المتعاقدين معبراً عن رغبتهما في التعاقد","النية القلبية","الشهود","التوثيق الكتابي"],
   correct:0,
   exp:"الصيغة: اللفظ الذي يصدر من المتعاقدين، معبراً عن رغبتهما في التعاقد."},

  {cat:"الأركان والصيغة", type:"mcq",
   q:"ما الإيجاب في البيع؟",
   opts:["اللفظ الصادر من البائع، سواء كان من مالك الثمن أو من يقوم مقامه","اللفظ الصادر من المشتري","النية","الإشارة"],
   correct:0,
   exp:"الإيجاب: اللفظ الصادر من البائع، سواء كان من مالك الثمن أو من يقوم مقامه كالوكيل والولي والوصي والناظر."},

  {cat:"الأركان والصيغة", type:"mcq",
   q:"ما القبول في البيع؟",
   opts:["اللفظ الصادر من المشتري، سواء كان من مالك الثمن أو من يقوم مقامه","اللفظ الصادر من البائع","النية","الإشارة"],
   correct:0,
   exp:"القبول: اللفظ الصادر من المشتري، سواء كان من مالك الثمن أو من يقوم مقامه."},

  {cat:"الأركان والصيغة", type:"mcq",
   q:"ما شروط الإيجاب والقبول؟",
   opts:["تقدّم الإيجاب على القبول، واتصاله به، وموافقة القبول للإيجاب","التلفظ بالعربية فقط","حضور الشهود","الكتابة"],

   exp:"شروط الإيجاب والقبول ثلاثة: تقدّم الإيجاب على القبول، واتصاله به، وموافقة القبول للإيجاب."},

  {cat:"الأركان والصيغة", type:"mcq",
   q:"الشرط الأول للإيجاب والقبول هو:",
   opts:["تقدّم الإيجاب على القبول","حضور الشهود","الكتابة","التلفظ بالعربية"],
   correct:0,
   exp:"الشرط الأول: تقدّم الإيجاب على القبول، كأن يقول البائع: بعتك أو ملكتك."},

   q:"حديث: «البيعان بالخيار ما لم يتفرقا، فإن صدقا وبينا بورك لهما في بيعهما، وإن كذبا وكتما محقت بركة بيعهما» رواه:",

  {cat:"الأركان والصيغة", type:"mcq",

  {cat:"الأركان والصيغة", type:"mcq",

   exp:"يصح العقد؛ لأن التراخي مع غيبة المشتري لا يدل على إعراض البائع عن الإيجاب."},

  // ===== بيع المعاطاة (26-33) =====
  {cat:"بيع المعاطاة", type:"mcq",
   q:"ما بيع المعاطاة؟",
   opts:["الصيغة الفعلية للبيع، وهي الأخذ والإعطاء بلا لفظ","البيع بالكتابة","البيع بالوكالة","بيع الغائب"],

  {cat:"بيع المعاطاة", type:"mcq",
   q:"من صور بيع المعاطاة:",

      btn.textContent = opt;
      btn.onclick = () => checkAnswer(i, btn);
      container.appendChild(btn);
    });
    answerArea.appendChild(container);
  } else if (q.type === 'fill') {
    const input = document.createElement('input');
    input.className = 'fill-input';
    input.placeholder = 'اكتب إجابتك هنا...';
    input.id = 'fillInput';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'تحقق';
    btn.onclick = () => checkFill();
    answerArea.appendChild(input);
    answerArea.appendChild(btn);
  }
  updateProgress();
}

function checkAnswer(selected, btn) {
  if (answered) return;
  answered = true;
  const q = questions[currentIndex];
  const allOpts = answerArea.querySelectorAll('.option');
  allOpts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === currentCorrectIndex) o.classList.add('correct');
  });
  if (selected === currentCorrectIndex) {
    score++;
    scoreEl.textContent = score;
    feedback.className = 'feedback correct show';
    feedback.innerHTML = '<strong>✔ إجابة صحيحة</strong>' + q.exp;
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    wrongEl.textContent = wrongCount;
    wrongList.push({q: q.q, correct: currentCorrectText, exp: q.exp});
    feedback.className = 'feedback wrong show';
    feedback.innerHTML = '<strong>✘ إجابة خاطئة</strong>الصحيح: ' + currentCorrectText + '<br>' + q.exp;
  }
  nextBtn.classList.remove('hidden');
}

function checkFill() {
  if (answered) return;
  const q = questions[currentIndex];
  const input = document.getElementById('fillInput');
  const val = input.value.trim();
  if (!val) return;
  answered = true;
  let isCorrect = false;
  q.answers.forEach(a => {
    if (val === a || val.includes(a) || a.includes(val)) isCorrect = true;
  });
  input.disabled = true;
  if (isCorrect) {
    score++;
    scoreEl.textContent = score;
    feedback.className = 'feedback correct show';
    feedback.innerHTML = '<strong>✔ إجابة صحيحة</strong>' + q.exp;
  } else {
    wrongCount++;
    wrongEl.textContent = wrongCount;
    wrongList.push({q: q.q, correct: q.answers[0], exp: q.exp});
    feedback.className = 'feedback wrong show';
    feedback.innerHTML = '<strong>✘ إجابة خاطئة</strong>الإجابة الصحيحة: ' + q.answers[0] + '<br>' + q.exp;
  }
  nextBtn.classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
  updateProgress();
}

function updateProgress() {
  const pct = ((currentIndex) / questions.length) * 100;
  progressFill.style.width = pct + '%';
}

function showResult() {
  quizBody.classList.add('hidden');
  resultScreen.classList.add('show');
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalTotal').textContent = questions.length;
  const pct = (score / questions.length) * 100;
  let title = '', msg = '';
  if (pct >= 90) { title = '🏆 ممتاز!'; msg = 'أداء رائع، أنت جاهز للاختبار بإذن الله.'; }
  else if (pct >= 75) { title = '👏 جيد جداً'; msg = 'مستوى طيب، راجع الأخطاء وستكون ممتازاً.'; }
  else if (pct >= 60) { title = '📖 جيد'; msg = 'تحتاج مراجعة بعض النقاط، ركز على الأخطاء.'; }
  else { title = '💪 يحتاج مراجعة'; msg = 'راجع الملف جيداً ثم أعد الاختبار.'; }
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg + ' نتيجتك: ' + score + ' من ' + questions.length + ' (' + pct.toFixed(1) + '%)';
  const reviewList = document.getElementById('reviewList');
  if (wrongList.length === 0) {
    reviewList.innerHTML = '<p style="text-align:center;color:#11998e;font-weight:bold;">🎉 لا توجد أخطاء! ممتاز!</p>';
  } else {
    reviewList.innerHTML = '<h3 style="margin-bottom:10px;color:#e74c3c;">مراجعة الأخطاء (' + wrongList.length + '):</h3>' +
      wrongList.map(w => '<div class="review-item"><div class="q">س: ' + w.q + '</div><div class="a">ج: ' + w.correct + '</div><div style="color:#666;font-size:0.85em;margin-top:4px;">' + w.exp + '</div></div>').join('');
  }
  progressFill.style.width = '100%';
}

function restartQuiz() {
  currentIndex = 0; score = 0; wrongCount = 0; wrongList = []; answered = false;
  scoreEl.textContent = 0; wrongEl.textContent = 0;
  resultScreen.classList.remove('show');
  quizBody.classList.remove('hidden');
  renderQuestion();
  updateProgress();
}

renderQuestion();
</script>
</body>
</html>
