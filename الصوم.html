<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الصيام وأحكامه</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    color: #333;
  }
  .container {
    background: #fff;
    max-width: 800px;
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    padding: 25px 20px;
    text-align: center;
  }
  header h1 { font-size: 1.6em; margin-bottom: 8px; }
  header p { font-size: 0.9em; opacity: 0.85; }
  .progress-bar {
    height: 8px;
    background: #e0e0e0;
    width: 100%;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #11998e, #38ef7d);
    width: 0%;
    transition: width 0.4s ease;
  }
  .stats {
    display: flex;
    justify-content: space-around;
    padding: 12px;
    background: #f5f7fa;
    font-size: 0.9em;
    font-weight: bold;
    border-bottom: 1px solid #e0e0e0;
  }
  .stats span { color: #2a5298; }
  .quiz-body { padding: 25px; min-height: 320px; }
  .category-badge {
    display: inline-block;
    background: #e8f0fe;
    color: #1e3c72;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.15em;
    font-weight: 600;
    line-height: 1.7;
    margin-bottom: 20px;
    color: #1a1a1a;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    padding: 14px 18px;
    border: 2px solid #d0d7de;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 1em;
    background: #fff;
    text-align: right;
    font-family: inherit;
  }
  .option:hover:not(.disabled) {
    border-color: #2a5298;
    background: #f0f6ff;
    transform: translateX(-4px);
  }
  .option.correct {
    border-color: #11998e;
    background: #d4f5e9;
    font-weight: bold;
  }
  .option.wrong {
    border-color: #e74c3c;
    background: #fde8e6;
    font-weight: bold;
  }
  .option.disabled { cursor: not-allowed; }
  .tf-buttons { display: flex; gap: 15px; }
  .tf-buttons .option { flex: 1; text-align: center; font-weight: bold; }
  .fill-input {
    width: 100%;
    padding: 14px;
    border: 2px solid #d0d7de;
    border-radius: 10px;
    font-size: 1em;
    font-family: inherit;
    margin-bottom: 12px;
  }
  .fill-input:focus { outline: none; border-color: #2a5298; }
  .btn {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    border: none;
    padding: 12px 30px;
    border-radius: 10px;
    font-size: 1em;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-next {
    display: block;
    margin: 20px auto 0;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: #003;
  }
  .feedback {
    margin-top: 18px;
    padding: 15px;
    border-radius: 10px;
    font-size: 0.95em;
    line-height: 1.7;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: #d4f5e9; border-right: 5px solid #11998e; }
  .feedback.wrong { background: #fde8e6; border-right: 5px solid #e74c3c; }
  .feedback strong { display: block; margin-bottom: 6px; }
  .result-screen { text-align: center; padding: 40px 25px; display: none; }
  .result-screen.show { display: block; }
  .score-circle {
    width: 150px; height: 150px;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
  }
  .score-circle .num { font-size: 2.5em; }
  .score-circle .lbl { font-size: 0.9em; opacity: 0.9; }
  .result-screen h2 { color: #1e3c72; margin-bottom: 15px; }
  .result-screen p { margin-bottom: 20px; line-height: 1.7; }
  .review-list {
    text-align: right;
    max-height: 300px;
    overflow-y: auto;
    margin: 20px 0;
    padding: 15px;
    background: #f9fafb;
    border-radius: 10px;
    border: 1px solid #e0e0e0;
  }
  .review-item {
    padding: 10px;
    border-bottom: 1px solid #e8e8e8;
    font-size: 0.9em;
    line-height: 1.6;
  }
  .review-item:last-child { border-bottom: none; }
  .review-item .q { font-weight: bold; color: #1e3c72; }
  .review-item .a { color: #11998e; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🕌 اختبار الصيام وأحكامه</h1>
    <p>مساق فقه العبادات 2 — إعداد: أمجد محمد عاطف الحناوي</p>
  </header>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="stats">
    <span>السؤال: <span id="qNum">1</span> / <span id="qTotal">100</span></span>
    <span>الصحيح: <span id="score">0</span></span>
    <span>الخطأ: <span id="wrong">0</span></span>
  </div>

  <div class="quiz-body" id="quizBody">
    <div class="category-badge" id="categoryBadge"></div>
    <div class="question-text" id="questionText"></div>
    <div id="answerArea"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-next hidden" id="nextBtn" onclick="nextQuestion()">السؤال التالي ←</button>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="score-circle">
      <span class="num" id="finalScore">0</span>
      <span class="lbl">من <span id="finalTotal">100</span></span>
    </div>
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <div class="review-list" id="reviewList"></div>
    <button class="btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
  </div>
</div>

<script>
const questions = [
  // ===== التعريف والأدلة (1-12) =====
  {cat:"التعريف والأدلة", type:"mcq",
   q:"ما معنى الصيام في اللغة؟",
   opts:["الإمساك والركود والثبات","السفر والتنقل","الأكل والشرب","الكلام والصمت"],
   correct:0,
   exp:"الصيام لغةً: الإمساك والركود في مكان، وأصل الكلمة يدل على إمساك وركود."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"الصوم في اللغة مصدر للفعل:",
   opts:["صام يصوم صوماً وصياماً","صَوَّم يُصوِّم","أصام يُصيم","صَيَّم يُصيِّم"],
   correct:0,
   exp:"الصوم مصدر الفعل صام يصوم صوماً وصياماً."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"قول الله تعالى: ﴿إِنِّي نَذَرْتُ لِلرَّحْمَنِ صَوْمًا﴾ يدل على أن الصوم في اللغة يشمل:",
   opts:["الإمساك عن الكلام والصمت","الإمساك عن الطعام فقط","الإمساك عن النكاح فقط","الإمساك عن الشراب فقط"],
   correct:0,
   exp:"الآية في سورة مريم تدل على أن الإمساك عن الكلام يُسمى صوماً في اللغة."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"عرف الحنفية الصيام اصطلاحاً بأنه:",
   opts:["الإمساك عن أشياء مخصوصة بشروط مخصوصة","الإمساك عن شهوتي الفم والفرج","إمساك مخصوص عن شيء مخصوص في زمن مخصوص من شخص مخصوص","الإمساك عن أشياء مخصوصة في وقت مخصوص"],
   correct:0,
   exp:"الحنفية: الإمساك عن أشياء مخصوصة، بشروط مخصوصة."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"عرف المالكية الصيام بأنه:",

   correct:0,
   exp:"المالكية: الإمساك عن شهوتي الفم والفرج أو ما يقوم مقامهما، مخالفة للهوى في طاعة المولى، في جميع أجزاء النهار بنية."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"عرف الشافعية الصيام بأنه:",
   opts:["إمساك مخصوص عن شيء مخصوص في زمن مخصوص من شخص مخصوص","الإمساك عن الطعام والشراب","الإمساك عن شهوتي الفم والفرج","الإمساك عن أشياء مخصوصة بشروط مخصوصة"],
   correct:0,
   exp:"الشافعية: إمساك مخصوص عن شيء مخصوص في زمن مخصوص من شخص مخصوص."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"عرف الحنابلة الصيام بأنه:",
   opts:["الإمساك عن أشياء مخصوصة في وقت مخصوص","الإمساك عن شهوتي الفم والفرج","إمساك مخصوص عن شيء مخصوص","الإمساك عن الكلام"],
   correct:0,
   exp:"الحنابلة: الإمساك عن أشياء مخصوصة، في وقت مخصوص."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"التعريف المختار للصيام عند المؤلف هو:",
   opts:["إمساك بنية عن أشياء مخصوصة في زمن معين من شخص مخصوص","الإمساك عن الطعام والشراب","الإمساك عن الكلام","الإمساك عن الشهوات فقط"],
   correct:0,
   exp:"التعريف المختار: إمساك بنية عن أشياء مخصوصة، في زمن معين، من شخص مخصوص."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"في أي سنة فُرض صيام شهر رمضان؟",
   opts:["السنة الثانية من الهجرة في شهر شعبان","السنة الأولى من الهجرة","السنة الثالثة من الهجرة","السنة الخامسة من الهجرة"],
   correct:0,
   exp:"فُرض صيام رمضان في السنة الثانية من الهجرة في شهر شعبان."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"كم رمضاناً صام النبي ﷺ؟",
   opts:["تسعة رمضانات","سبعة رمضانات","عشرة رمضانات","ثمانية رمضانات"],
   correct:0,
   exp:"صام النبي ﷺ تسعة رمضانات."},

  {cat:"التعريف والأدلة", type:"mcq",
   q:"ما الذي كان مفروضاً قبل فرض صوم رمضان؟",
   opts:["صوم يوم عاشوراء","صوم يوم عرفة","صوم الأيام البيض","صوم الاثنين والخميس"],
   correct:0,
   exp:"قبل فرض صوم رمضان كان المفروض صوم يوم عاشوراء."},

  {cat:"التعريف والأدلة", type:"tf",
   q:"النية شرط لصحة قبول الأعمال، فلا يُقبل عمل دون نية.",
   correct:true,
   exp:"قال النبي ﷺ: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى»."},

  // ===== الأركان والنية =====
  {cat:"الأركان والنية", type:"mcq",
   q:"ما ركنا الصيام الأساسيان؟",
   opts:["النية والإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس","النية والوضوء","الإمساك والصلاة","الصيام والصدقة"],
   correct:0,
   exp:"ركنا الصيام: النية، والإمساك عن المفطرات من طلوع الفجر إلى غروب الشمس."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما محل النية في الصيام؟",
   opts:["القلب ولا تكفي باللسان ولا يشترط التلفظ بها","اللسان فقط","القلب واللسان معاً","الجوارح"],
   correct:0,
   exp:"محل النية القلب، ولا تكفي باللسان، ولا يشترط التلفظ بها."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما حكم النية في صوم رمضان عند المالكية والشافعية والحنابلة؟",
   opts:["واجبة وركن لا يصح الصيام إلا بها","شرط للجواز فقط","سنة مستحبة","مكروهة"],
   correct:0,
   exp:"عند المالكية والشافعية والحنابلة: النية واجبة وركن، لا يصح الصيام إلا بها."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما حكم النية عند الحنفية في صوم رمضان؟",
   opts:["شرط لجواز الصيام","ركن من أركان الصيام","سنة","مستحبة"],
   correct:0,
   exp:"عند الحنفية: النية شرط لجواز الصيام لا ركن."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما معنى التبييت في النية؟",
   opts:["أن يتوافر القصد في الليل قبل طلوع الفجر","أن ينوي بعد الفجر","أن ينوي عند الغروب","أن يتلفظ بالنية"],
   correct:0,
   exp:"التبييت: أن يتوافر القصد في الليل، أي قبل طلوع الفجر."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما حكم من لم يبيت الصيام قبل طلوع الفجر عند المالكية والشافعية والحنابلة؟",
   opts:["بطلت نيته وبطل صومه","صح صومه","يُكره صومه فقط","يعيد النية بعد الفجر"],
   correct:0,
   exp:"عند المالكية والشافعية والحنابلة: من لم يبيت الصيام قبل الفجر بطلت نيته وبطل صومه."},

  {cat:"الأركان والنية", type:"mcq",
   q:"من ذهب إلى جواز النية في النهار لصوم رمضان؟",
   opts:["الحنفية","المالكية","الشافعية","الحنابلة"],
   correct:0,
   exp:"ذهب الحنفية إلى النية في النهار لصوم رمضان، وصوم التطوع، والمنذور المعين."},

  {cat:"الأركان والنية", type:"mcq",
   q:"من وافق الحنفية في جواز النية في النهار لصوم التطوع؟",
   opts:["الشافعية","المالكية","الحنابلة","الظاهرية"],
   correct:0,
   exp:"وافق الشافعيةُ الحنفيةَ في صوم التطوع."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما معنى التعيين في النية؟",
   opts:["أن يعين نوع الصوم فيعزم على صيام غد من رمضان","أن ينوي مطلق الصوم","أن يتلفظ بالنية","أن ينوي قبل الفجر فقط"],
   correct:0,
   exp:"التعيين: أن يعين نوع الصوم، فيعزم في قلبه على صيام غد من رمضان."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما حكم تعيين النية عند الحنفية في صوم رمضان؟",
   opts:["لا يجب، والنية المطلقة تكفي","واجب","سنة","مكروه"],
   correct:0,
   exp:"ذهب الحنفية إلى عدم وجوب تعيين النية لصوم رمضان، والنية المطلقة تكفي."},

  {cat:"الأركان والنية", type:"mcq",
   q:"ما الدليل على أن النية شرط في الصيام؟",
   opts:["حديث: «إنما الأعمال بالنيات»","حديث: «صوموا لرؤيته»","آية: ﴿وَكُلُوا وَاشْرَبُوا﴾","حديث: «تسحروا فإن في السحور بركة»"],
   correct:0,
   exp:"الدليل: حديث «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى»."},

  {cat:"الأركان والنية", type:"tf",
   q:"يشترط التلفظ بالنية باللسان لصحة الصيام.",
   correct:false,
   exp:"لا يشترط التلفظ بالنية، ومحلها القلب، ولا تكفي باللسان."},

  {cat:"الأركان والنية", type:"tf",

  {cat:"الأركان والنية", type:"tf",
   q:"يجوز عند الحنفية النية في النهار لصوم رمضان.",
   correct:true,
   exp:"نعم، الحنفية يجيزون النية في النهار لصوم رمضان."},

  {cat:"الأركان والنية", type:"tf",
   q:"النية المطلقة تكفي لصوم رمضان عند الحنفية.",
   correct:true,
   exp:"نعم، الحنفية: النية المطلقة تكفي لصوم رمضان."},

  {cat:"الأركان والنية", type:"fill",

   answers:["طلوع الفجر"],
   correct:0,
   exp:"الإمساك يكون من طلوع الفجر إلى غروب الشمس."},

  // ===== المفطرات =====
  {cat:"المفطرات", type:"mcq",
   q:"ما حكم الأكل والشرب عمداً في الصيام؟",
   opts:["مفطر ولو كان قليلاً","لا يفطر إذا كان قليلاً","يفطر إذا كان كثيراً فقط","مكروه فقط"],

   exp:"الأكل والشرب عمداً مفطر، مهما كان قليلاً."},

  {cat:"المفطرات", type:"mcq",

   correct:0,
   exp:"من نسي فأكل أو شرب لم يفطر، لما ورد: «إذا نسي فأكل وشرب فليتم صومه، فإنما أطعمه الله وسقاه»."},

  {cat:"المفطرات", type:"mcq",
   q:"ما المقصود بالمنفذ المفتوح؟",
   opts:["الفم والأذن والقبل والدبر","الفم فقط","الأنف فقط","الوريد"],
   correct:0,
   exp:"المنفذ المفتوح: الفم والأذن والقبل والدبر من الذكر والأنثى."},

  {cat:"المفطرات", type:"mcq",
   q:"ما حكم القطرة في الأذن أو العين للصائم؟",
   opts:["مفطرة لأنهما يصلان إلى الجوف من منفذ مفتوح","غير مفطرة","مكروهة فقط","مفطرة إذا كانت كثيرة"],
   correct:0,
   exp:"القطرة في الأذن والعين مفطرة؛ لأنهما يصلان إلى الجوف من منفذ مفتوح."},

// ===== منطق الاختبار =====
let currentIndex = 0;
let score = 0;
let wrongCount = 0;
let wrongList = [];
let answered = false;
let currentOptions = [];
let currentCorrectIndex = 0;
let currentCorrectText = '';

const qTotal = document.getElementById('qTotal');
const qNum = document.getElementById('qNum');
const scoreEl = document.getElementById('score');
const wrongEl = document.getElementById('wrong');
const progressFill = document.getElementById('progressFill');
const categoryBadge = document.getElementById('categoryBadge');
const questionText = document.getElementById('questionText');
const answerArea = document.getElementById('answerArea');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizBody = document.getElementById('quizBody');
const resultScreen = document.getElementById('resultScreen');

qTotal.textContent = questions.length;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion() {
  answered = false;
  const q = questions[currentIndex];
  qNum.textContent = currentIndex + 1;
  categoryBadge.textContent = q.cat;
  questionText.textContent = q.q;
  feedback.className = 'feedback';
  feedback.innerHTML = '';
  nextBtn.classList.add('hidden');
  answerArea.innerHTML = '';

  if (q.type === 'mcq' || q.type === 'tf') {
    if (q.type === 'tf') {
      currentOptions = ['صح', 'خطأ'];
      currentCorrectIndex = q.correct ? 0 : 1;
      currentCorrectText = q.correct ? 'صح' : 'خطأ';
    } else {
      const indices = q.opts.map((_, i) => i);
      const shuffled = shuffle(indices);
      currentOptions = shuffled.map(i => q.opts[i]);
      currentCorrectIndex = shuffled.indexOf(q.correct);
      currentCorrectText = q.opts[q.correct];
    }
    const container = document.createElement('div');
    container.className = 'options';
    if (q.type === 'tf') container.classList.add('tf-buttons');
    currentOptions.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(i, btn);
      container.appendChild(btn);
    });
    answerArea.appendChild(container);
  } else if (q.type === 'fill') {
    const input = document.createElement('input');
    input.className = 'fill-input';
    input.placeholder = 'اكتب إجابتك هنا...';
    input.id = 'fillInput';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'تحقق';
    btn.onclick = () => checkFill();
    answerArea.appendChild(input);
    answerArea.appendChild(btn);
  }
  updateProgress();
}

function checkAnswer(selected, btn) {
  if (answered) return;
  answered = true;
  const q = questions[currentIndex];
  const allOpts = answerArea.querySelectorAll('.option');
  allOpts.forEach((o, i) => {
    o.classList.add('disabled');
    if (i === currentCorrectIndex) o.classList.add('correct');
  });
  if (selected === currentCorrectIndex) {
    score++;
    scoreEl.textContent = score;
    feedback.className = 'feedback correct show';
    feedback.innerHTML = '<strong>✔ إجابة صحيحة</strong>' + q.exp;
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    wrongEl.textContent = wrongCount;
    wrongList.push({q: q.q, correct: currentCorrectText, exp: q.exp});
    feedback.className = 'feedback wrong show';
    feedback.innerHTML = '<strong>✘ إجابة خاطئة</strong>الصحيح: ' + currentCorrectText + '<br>' + q.exp;
  }
  nextBtn.classList.remove('hidden');
}

function checkFill() {
  if (answered) return;
  const q = questions[currentIndex];
  const input = document.getElementById('fillInput');
  const val = input.value.trim();
  if (!val) return;
  answered = true;
  let isCorrect = false;
  q.answers.forEach(a => {
    if (val === a || val.includes(a) || a.includes(val)) isCorrect = true;
  });
  input.disabled = true;
  if (isCorrect) {
    score++;
    scoreEl.textContent = score;
    feedback.className = 'feedback correct show';
    feedback.innerHTML = '<strong>✔ إجابة صحيحة</strong>' + q.exp;
  } else {
    wrongCount++;
    wrongEl.textContent = wrongCount;
    wrongList.push({q: q.q, correct: q.answers[0], exp: q.exp});
    feedback.className = 'feedback wrong show';
    feedback.innerHTML = '<strong>✘ إجابة خاطئة</strong>الإجابة الصحيحة: ' + q.answers[0] + '<br>' + q.exp;
  }
  nextBtn.classList.remove('hidden');
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
  updateProgress();
}

function updateProgress() {
  const pct = ((currentIndex) / questions.length) * 100;
  progressFill.style.width = pct + '%';
}

function showResult() {
  quizBody.classList.add('hidden');
  resultScreen.classList.add('show');
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalTotal').textContent = questions.length;
  const pct = (score / questions.length) * 100;
  let title = '', msg = '';
  if (pct >= 90) { title = '🏆 ممتاز!'; msg = 'أداء رائع، أنت جاهز للاختبار بإذن الله.'; }
  else if (pct >= 75) { title = '👏 جيد جداً'; msg = 'مستوى طيب، راجع الأخطاء وستكون ممتازاً.'; }
  else if (pct >= 60) { title = '📖 جيد'; msg = 'تحتاج مراجعة بعض النقاط، ركز على الأخطاء.'; }
  else { title = '💪 يحتاج مراجعة'; msg = 'راجع الملف جيداً ثم أعد الاختبار.'; }
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg + ' نتيجتك: ' + score + ' من ' + questions.length + ' (' + pct.toFixed(1) + '%)';
  const reviewList = document.getElementById('reviewList');
  if (wrongList.length === 0) {
    reviewList.innerHTML = '<p style="text-align:center;color:#11998e;font-weight:bold;">🎉 لا توجد أخطاء! ممتاز!</p>';
  } else {
    reviewList.innerHTML = '<h3 style="margin-bottom:10px;color:#e74c3c;">مراجعة الأخطاء (' + wrongList.length + '):</h3>' +
      wrongList.map(w => '<div class="review-item"><div class="q">س: ' + w.q + '</div><div class="a">ج: ' + w.correct + '</div><div style="color:#666;font-size:0.85em;margin-top:4px;">' + w.exp + '</div></div>').join('');
  }
  progressFill.style.width = '100%';
}

function restartQuiz() {
  currentIndex = 0; score = 0; wrongCount = 0; wrongList = []; answered = false;
  scoreEl.textContent = 0; wrongEl.textContent = 0;
  resultScreen.classList.remove('show');
  quizBody.classList.remove('hidden');
  renderQuestion();
  updateProgress();
}

renderQuestion();
</script>
